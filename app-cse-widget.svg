<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 156" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <defs>
    <linearGradient id="gloss-card-ac" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fbfbfd" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="gloss-sheen-ac" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="154" rx="16" fill="url(#gloss-card-ac)" stroke="#e5e7eb" stroke-width="1.4" />
  <rect x="2" y="2" width="836" height="62" rx="15" fill="url(#gloss-sheen-ac)" />
  <line x1="22" y1="2.5" x2="818" y2="2.5" stroke="#ffffff" stroke-width="1.1" />

  <!-- Header Row -->
  <text x="28" y="30" class="font-mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.8">03 · CLIENT-SIDE PROCUREMENT &amp; RBAC WORKFLOW SANDBOX</text>
  <rect x="706" y="15" width="106" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <circle cx="720" cy="26" r="3" fill="#10b981" />
  <text x="765" y="29.5" class="font-mono" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">LIVE SANDBOX</text>

  <!-- Title & Calm Description -->
  <text x="28" y="62" class="font-sans" font-size="21" font-weight="800" fill="#111827">app-cse-public-demo (OpenProcure)</text>
  <text x="28" y="86" class="font-sans" font-size="12.5" fill="#4b5563">Interactive browser sandbox featuring 6 RBAC personas, fiscal ceiling planning, inventory ledger,</text>
  <text x="28" y="104" class="font-sans" font-size="12.5" fill="#4b5563">PPMP/SR/PR/PO workflows, Excel/CSV/PDF client-side extraction, and A4 printable government forms.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 118)">
    <rect x="0" y="0" width="76" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="38" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">React 18</text>

    <rect x="84" y="0" width="88" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="128" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">TypeScript</text>

    <rect x="180" y="0" width="96" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="228" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Tailwind CSS</text>

    <rect x="284" y="0" width="72" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="320" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">SheetJS</text>

    <rect x="364" y="0" width="66" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="397" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">PDF.js</text>

    <rect x="438" y="0" width="88" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="482" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">A4 Print</text>
  </g>
</svg>
