  <!-- Col 4 -->
  <g transform="translate(626, 52)">
    <rect x="0" y="0" width="188" height="98" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#6b7280">04 · QUALITY &amp; OPS</text>
    <text x="14" y="44" class="font-sans" font-size="11.5" font-weight="600" fill="#111827">pytest · ruff · Django CI</text>
    <text x="14" y="63" class="font-sans" font-size="11.5" fill="#4b5563">GitHub Actions · Docker</text>
