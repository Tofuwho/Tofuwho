<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 168" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <defs>
    <linearGradient id="gloss-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fbfbfd" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="gloss-sheen-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="166" rx="16" fill="url(#gloss-cap)" stroke="#e5e7eb" stroke-width="1.4" />
  <rect x="2" y="2" width="836" height="58" rx="15" fill="url(#gloss-sheen-cap)" />

  <!-- Header -->
  <text x="26" y="27" class="font-mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.8">WHAT I WORK WITH</text>
  <text x="814" y="27" class="font-mono" font-size="9.5" font-weight="600" fill="#6b7280" text-anchor="end">CLEAN, TESTED ARCHITECTURE</text>
  <line x1="26" y1="38" x2="814" y2="38" stroke="#e5e7eb" stroke-width="1" />

  <!-- Col 1 -->
  <g transform="translate(26, 52)">
    <rect x="0" y="0" width="188" height="98" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#6b7280">01 · FULL-STACK</text>
    <text x="14" y="44" class="font-sans" font-size="11.5" font-weight="600" fill="#111827">Next.js · React · TS</text>
    <text x="14" y="63" class="font-sans" font-size="11.5" fill="#4b5563">Python · Django · FastAPI</text>
    <text x="14" y="82" class="font-sans" font-size="11" fill="#6b7280">Node.js · Express · Electron</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(226, 52)">
    <rect x="0" y="0" width="188" height="98" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#6b7280">02 · DATA &amp; SEARCH</text>
    <text x="14" y="44" class="font-sans" font-size="11.5" font-weight="600" fill="#111827">Polars · SheetJS · PDF.js</text>
    <text x="14" y="63" class="font-sans" font-size="11.5" fill="#4b5563">PyMuPDF · RapidFuzz</text>
    <text x="14" y="82" class="font-sans" font-size="11" fill="#6b7280">NLTK · Audit Lineage</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(426, 52)">
    <rect x="0" y="0" width="188" height="98" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#6b7280">03 · STORAGE &amp; RBAC</text>
    <text x="14" y="44" class="font-sans" font-size="11.5" font-weight="600" fill="#111827">MariaDB · MySQL · SQLite</text>
    <text x="14" y="63" class="font-sans" font-size="11.5" fill="#4b5563">SQLAlchemy · Alembic</text>
    <text x="14" y="82" class="font-sans" font-size="11" fill="#6b7280">Roles · Fiscal DocGen</text>
