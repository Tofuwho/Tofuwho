<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="100%" height="100%">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .pulse-dot {
      animation: pulse 2.4s infinite ease-in-out;
    }
  </style>

  <defs>
    <linearGradient id="gloss-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fbfbfd" />
      <stop offset="100%" stop-color="#f2f4f7" />
    </linearGradient>
    <linearGradient id="top-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="inner-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Outer Gloss White Card -->
  <rect x="1" y="1" width="878" height="236" rx="20" fill="url(#gloss-surface)" stroke="#e5e7eb" stroke-width="1.4" />
  <rect x="2" y="2" width="876" height="96" rx="19" fill="url(#top-sheen)" />
  <line x1="24" y1="2.5" x2="856" y2="2.5" stroke="#ffffff" stroke-width="1.2" />

  <!-- Top Status Pills -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="166" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#10b981" class="pulse-dot" />
    <text x="25" y="15.5" class="font-mono" font-size="10" font-weight="700" fill="#047857" letter-spacing="0.4">OPEN FOR HIRING</text>

    <rect x="176" y="0" width="214" height="24" rx="12" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" />
    <text x="283" y="15.5" class="font-mono" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">NCR, PH · REMOTE / ON-SITE</text>
  </g>

  <!-- Name & Introduction -->
  <text x="40" y="92" class="font-sans" font-size="31" font-weight="800" fill="#111827" letter-spacing="-0.6">John Mark Cayabyab</text>
  <text x="40" y="118" class="font-sans" font-size="14" font-weight="600" fill="#374151">Full-Stack Software Engineer  ·  @Tofuwho</text>

  <text x="40" y="146" class="font-sans" font-size="12.5" fill="#4b5563">Building calm, reliable web apps, data workflows, and everyday tools</text>
  <text x="40" y="165" class="font-sans" font-size="12.5" fill="#4b5563">focused on clean architecture, maintainable code, and real-world use.</text>

  <!-- Calm Specialty Pills -->
  <g transform="translate(40, 184)">
    <rect x="0" y="0" width="144" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="72" y="17" class="font-mono" font-size="10.2" font-weight="600" fill="#374151" text-anchor="middle">Python &amp; TypeScript</text>

    <rect x="154" y="0" width="154" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="231" y="17" class="font-mono" font-size="10.2" font-weight="600" fill="#374151" text-anchor="middle">Full-Stack &amp; APIs</text>

    <rect x="318" y="0" width="142" height="26" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="389" y="17" class="font-mono" font-size="10.2" font-weight="600" fill="#374151" text-anchor="middle">Data &amp; Search UI</text>
  </g>

  <!-- Right Panel: Clean Selected Work Card -->
  <g transform="translate(566, 26)">
    <rect x="0" y="0" width="274" height="186" rx="14" fill="url(#inner-panel)" stroke="#e5e7eb" stroke-width="1.2" />

    <circle cx="18" cy="20" r="3.2" fill="#10b981" class="pulse-dot" />
    <text x="28" y="23.5" class="font-mono" font-size="9.8" font-weight="700" fill="#374151" letter-spacing="0.5">SELECTED BUILDS</text>
    <text x="256" y="23.5" class="font-mono" font-size="9.5" font-weight="600" fill="#6b7280" text-anchor="end">2026</text>
    <line x1="16" y1="36" x2="258" y2="36" stroke="#e5e7eb" stroke-width="1" />

    <!-- Row 1 -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="246" height="39" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
      <text x="12" y="16.5" class="font-sans" font-size="11.5" font-weight="700" fill="#111827">Data-Assist</text>
      <text x="234" y="16.5" class="font-mono" font-size="8.8" font-weight="600" fill="#4b5563" text-anchor="end">LATEST</text>
      <text x="12" y="31" class="font-sans" font-size="10" fill="#6b7280">Audited CSV &amp; Excel reporting</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(14, 92)">
      <rect x="0" y="0" width="246" height="39" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
      <text x="12" y="16.5" class="font-sans" font-size="11.5" font-weight="700" fill="#111827">ThesisLibrary</text>
      <text x="234" y="16.5" class="font-mono" font-size="8.8" font-weight="700" fill="#047857" text-anchor="end">LIVE DEMO</text>
      <text x="12" y="31" class="font-sans" font-size="10" fill="#6b7280">Hybrid PDF search &amp; OPAC</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(14, 138)">
      <rect x="0" y="0" width="246" height="39" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
      <text x="12" y="16.5" class="font-sans" font-size="11.5" font-weight="700" fill="#111827">app-cse-public-demo</text>
      <text x="234" y="16.5" class="font-mono" font-size="8.8" font-weight="700" fill="#047857" text-anchor="end">LIVE DEMO</text>
      <text x="12" y="31" class="font-sans" font-size="10" fill="#6b7280">Procurement RBAC sandbox</text>
    </g>
  </g>
</svg>
