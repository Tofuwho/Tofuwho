<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .card-title { font-weight: 700; font-size: 11px; fill: #a78bfa; letter-spacing: 1.5px; }
    .proj-name { font-weight: 800; font-size: 22px; fill: #ffffff; }
    .badge-bg { fill: #1e1b4b; stroke: #06b6d4; stroke-width: 1.2; rx: 5px; }
    .badge-text { font-size: 11px; fill: #cbd5e1; font-weight: 600; }
    .desc { font-size: 13.5px; fill: #cbd5e1; line-height: 1.6; }
    .accent-bg { fill: #130f26; stroke: #2e2252; stroke-width: 1.5; rx: 10px; }
    .decor-box { fill: #1a153b; stroke: #a78bfa; stroke-width: 1; rx: 6px; }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" class="accent-bg" />
  
  <!-- Header Separator -->
  <line x1="28" y1="42" x2="752" y2="42" stroke="#2e2252" stroke-width="1" opacity="0.6" />

  <!-- Category Badge -->
  <text x="28" y="30" class="font-mono card-title">FEATURED_REPOSITORY &#x2022; COURT BOOKING &amp; GAME FINDER</text>
  
  <!-- Project Title -->
  <text x="28" y="74" class="font-sans proj-name">PicklePH</text>
  
  <!-- Description -->
  <text x="28" y="100" class="font-sans desc">A court booking and game finder platform for Pickleball players in Metro Manila &#x2014;</text>
  <text x="28" y="120" class="font-sans desc">browse available courts, assess schedule availability, and organize local games.</text>
  
  <!-- Right Side Visual Decoration -->
  <g transform="translate(620, 52)">
    <rect x="0" y="0" width="132" height="78" class="decor-box" opacity="0.8" />
    <rect x="14" y="14" width="104" height="50" rx="3" fill="#0f0c24" stroke="#a78bfa" stroke-width="0.8" />
    <line x1="66" y1="14" x2="66" y2="64" stroke="#a78bfa" stroke-dasharray="2 2" stroke-width="0.8" />
    <circle cx="40" cy="39" r="6" fill="#10b981" />
    <circle cx="92" cy="39" r="6" fill="#facc15" />
  </g>

  <!-- Tech badges at bottom left -->
  <g transform="translate(190, 74)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="68" height="22" class="badge-bg" />
      <text x="34" y="3" class="font-mono badge-text" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(76, 0)">
      <rect x="0" y="-12" width="68" height="22" class="badge-bg" stroke="#facc15" fill="#2d220a" />
      <text x="34" y="3" class="font-mono badge-text" text-anchor="middle" fill="#facc15">Django</text>
    </g>
    <g transform="translate(152, 0)">
      <rect x="0" y="-12" width="64" height="22" class="badge-bg" stroke="#10b981" fill="#0f261c" />
      <text x="32" y="3" class="font-mono badge-text" text-anchor="middle" fill="#10b981">MySQL</text>
    </g>
  </g>
</svg>
