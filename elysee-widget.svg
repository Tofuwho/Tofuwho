<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .card-title { font-weight: 700; font-size: 11px; fill: #06b6d4; letter-spacing: 1.5px; }
    .proj-name { font-weight: 800; font-size: 22px; fill: #ffffff; }
    .badge-bg { fill: #1e1b4b; stroke: #06b6d4; stroke-width: 1.2; rx: 5px; }
    .badge-text { font-size: 11px; fill: #cbd5e1; font-weight: 600; }
    .desc { font-size: 13.5px; fill: #cbd5e1; line-height: 1.6; }
    .accent-bg { fill: #130f26; stroke: #2e2252; stroke-width: 1.5; rx: 10px; }
    .decor-box { fill: #1a153b; stroke: #06b6d4; stroke-width: 1; rx: 6px; }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" class="accent-bg" />
  
  <!-- Header Separator -->
  <line x1="28" y1="42" x2="752" y2="42" stroke="#2e2252" stroke-width="1" opacity="0.6" />

  <!-- Category Badge -->
  <text x="28" y="30" class="font-mono card-title">FEATURED_REPOSITORY &#x2022; LUXURY PRODUCT LANDING PAGE</text>
  
  <!-- Project Title -->
  <text x="28" y="74" class="font-sans proj-name">ELYSEE</text>
  
  <!-- Description -->
  <text x="28" y="100" class="font-sans desc">A luxury product landing page sample crafted to showcase elegance, high-end aesthetics,</text>
  <text x="28" y="120" class="font-sans desc">modern web design patterns, smooth micro-animations, and responsive visual storytelling.</text>
  
  <!-- Right Side Visual Decoration -->
  <g transform="translate(620, 52)">
    <rect x="0" y="0" width="132" height="78" class="decor-box" opacity="0.8" />
    <circle cx="16" cy="16" r="4" fill="#06b6d4" />
    <circle cx="30" cy="16" r="4" fill="#facc15" />
    <circle cx="44" cy="16" r="4" fill="#a78bfa" />
    <line x1="10" y1="30" x2="122" y2="30" stroke="#2e2252" stroke-width="1" />
    <rect x="12" y="40" width="60" height="6" rx="3" fill="#06b6d4" opacity="0.7" />
    <rect x="12" y="52" width="90" height="5" rx="2.5" fill="#2e2252" />
    <rect x="12" y="62" width="40" height="5" rx="2.5" fill="#2e2252" />
  </g>

  <!-- Tech badges at bottom left -->
  <g transform="translate(200, 74)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="62" height="22" class="badge-bg" />
      <text x="31" y="3" class="font-mono badge-text" text-anchor="middle">HTML5</text>
    </g>
    <g transform="translate(70, 0)">
      <rect x="0" y="-12" width="56" height="22" class="badge-bg" stroke="#facc15" fill="#2d220a" />
      <text x="28" y="3" class="font-mono badge-text" text-anchor="middle" fill="#facc15">CSS3</text>
    </g>
    <g transform="translate(134, 0)">
      <rect x="0" y="-12" width="94" height="22" class="badge-bg" stroke="#a78bfa" fill="#251a4a" />
      <text x="47" y="3" class="font-mono badge-text" text-anchor="middle" fill="#a78bfa">JavaScript</text>
    </g>
  </g>
</svg>
