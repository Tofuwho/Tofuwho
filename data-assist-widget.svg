<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 156" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <defs>
    <linearGradient id="gloss-card-da" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fbfbfd" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="gloss-sheen-da" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="154" rx="16" fill="url(#gloss-card-da)" stroke="#e5e7eb" stroke-width="1.4" />
  <rect x="2" y="2" width="836" height="62" rx="15" fill="url(#gloss-sheen-da)" />
  <line x1="22" y1="2.5" x2="818" y2="2.5" stroke="#ffffff" stroke-width="1.1" />

  <!-- Header Row -->
  <text x="28" y="30" class="font-mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.8">01 · DATA QUALITY &amp; REPORTING PLATFORM</text>
  <rect x="722" y="15" width="90" height="22" rx="11" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" />
  <text x="767" y="29.5" class="font-mono" font-size="9.5" font-weight="700" fill="#374151" text-anchor="middle">ACTIVE</text>

  <!-- Title & Calm Description -->
  <text x="28" y="62" class="font-sans" font-size="21" font-weight="800" fill="#111827">Data-Assist (ClearData)</text>
  <text x="28" y="86" class="font-sans" font-size="12.5" fill="#4b5563">Turns messy CSV and multi-sheet Excel exports into clean, audited analyses and interactive reports —</text>
  <text x="28" y="104" class="font-sans" font-size="12.5" fill="#4b5563">featuring immutable raw data, deterministic anomaly profiling, verified briefings, and source row lineage.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 118)">
    <rect x="0" y="0" width="82" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="41" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Next.js 16</text>

    <rect x="90" y="0" width="72" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="126" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">FastAPI</text>

    <rect x="170" y="0" width="64" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="202" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Polars</text>

    <rect x="242" y="0" width="90" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="287" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">SQLAlchemy</text>

    <rect x="340" y="0" width="88" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="384" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">TypeScript</text>

    <rect x="436" y="0" width="94" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="483" y="14.5" class="font-mono" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">42+ Pytests</text>
  </g>
</svg>
